<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Lunas Gym</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-cuenta">

    <!-- Encabezado -->

    <header class="header-cuenta">

        <a href="index.html" class="logo-cuenta">
            LUNAS GYM
        </a>

    </header>


    <!-- Inicio de sesión -->

    <main class="contenedor-cuenta">

        <div class="tarjeta-cuenta">

            <h1>Iniciar sesión</h1>

            <div class="linea-cuenta"></div>

            <p class="texto-cuenta">
                Ingresa a tu cuenta para administrar tu membresía,
                entrenamientos y progreso.
            </p>


            <form>

                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>

                </div>


                <div class="campo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        required>

                </div>


                <a href="#" class="olvide-contrasena">
                    ¿Olvidaste tu contraseña?
                </a>


                <button type="submit" class="boton-cuenta">
                    Iniciar sesión
                </button>

            </form>


            <div class="separador-cuenta"></div>


            <p class="cambiar-cuenta">
                ¿Todavía no tienes una cuenta?

                <a href="registro.html">
                    Regístrate
                </a>
            </p>

        </div>

    </main>


    <!-- Pie de página -->

    <footer class="footer-cuenta">

        <p>
            © 2026 Lunas Gym. Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
