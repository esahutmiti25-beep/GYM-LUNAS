<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Lunas Gym</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-cuenta">

    <!-- Encabezado -->

    <header class="header-cuenta">

        <a href="index.html" class="logo-cuenta">
            LUNAS GYM
        </a>

    </header>


    <!-- Registro -->

    <main class="contenedor-cuenta">

        <div class="tarjeta-cuenta">

            <h1>Crear cuenta</h1>

            <div class="linea-cuenta"></div>

            <p class="texto-cuenta">
                Crea tu cuenta para comenzar a formar parte
                de Lunas Gym.
            </p>


            <form action="perfil.html">

                <div class="campo">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre"
                        required>

                </div>


                <div class="campo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="441 123 4567"
                        required>

                </div>


                <div class="campo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Crea una contraseña"
                        required>

                </div>


                <div class="campo">

                    <label for="confirmar">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repite tu contraseña"
                        required>

                </div>


                <label class="terminos">

                    <input type="checkbox" required>

                    <span>
                        Acepto los términos y condiciones
                        de Lunas Gym.
                    </span>

                </label>


                <button type="submit" class="boton-cuenta">
                    Crear cuenta
                </button>

            </form>


            <div class="separador-cuenta"></div>


            <p class="cambiar-cuenta">

                ¿Ya tienes una cuenta?

                <a href="login.html">
                    Inicia sesión
                </a>

            </p>

        </div>

    </main>


    <!-- Pie de página -->

    <footer class="footer-cuenta">

        <p>
            © 2026 Lunas Gym. Todos los derechos reservados.
        </p>

    </footer>

</body>

</html>
